name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  AUTH_SECRET: ci-auth-secret-0123456789abcdefghijklmnopqrstuv
  APP_ENCRYPTION_KEY: ci-encryption-key-0123456789abcdefghijklmnop
  APP_DB_PASSWORD: app_ci_password
  DATABASE_URL: postgres://app_user:app_ci_password@localhost:5432/platform_test
  DATABASE_OWNER_URL: postgres://platform_owner:owner_ci@localhost:5432/platform_test
  TEST_DATABASE_URL: postgres://app_user:app_ci_password@localhost:5432/platform_test
  TEST_DATABASE_OWNER_URL: postgres://platform_owner:owner_ci@localhost:5432/platform_test
  REDIS_URL: redis://localhost:6379
  # Test-mode payment adapter (refuses to run when APP_ENV=production). Integration tests exercise checkout/payments with it.
  PAYMENT_PROVIDER: test
  TEST_PAYMENT_WEBHOOK_SECRET: ci-test-webhook-secret

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: platform_owner
          POSTGRES_PASSWORD: owner_ci
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_owner" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Migration validation (apply from scratch + drift check)
        run: |
          pnpm db:migrate
          pnpm --filter @platform/db exec drizzle-kit check
          pnpm --filter @platform/db exec drizzle-kit generate --name ci_drift_check | tee /tmp/drift.txt
          if grep -q "Your SQL migration file" /tmp/drift.txt; then echo "Schema drift: migrations are not up to date"; exit 1; fi
      - name: Integration tests
        run: pnpm test:integration
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported issues"
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://app_user:app_ci_password@localhost:5432/platform_test

  images:
    # Builds both production images (no push). Publishing/deploying is a manual, approved step.
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/worker.Dockerfile, push: false, tags: "platform-worker:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/web.Dockerfile, push: false, tags: "platform-web:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
