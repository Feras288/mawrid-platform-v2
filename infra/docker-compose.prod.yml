# Production / staging stack (Coolify "Docker Compose" resource or plain `docker compose`).
# All secrets come from the environment (Coolify secrets or an untracked .env.production) — never commit them.
# Object storage (S3), SMTP, payments and AI are external services configured via environment / admin settings.
name: platform

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_URL: ${APP_URL:?set APP_URL}
  BRAND_NAME_AR: ${BRAND_NAME_AR:-مَوْرِد}
  BRAND_NAME_EN: ${BRAND_NAME_EN:-Mawrid}
  DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-platform}
  REDIS_URL: redis://valkey:6379
  AUTH_SECRET: ${AUTH_SECRET:?}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
  MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
  MOYASAR_PUBLISHABLE_KEY: ${MOYASAR_PUBLISHABLE_KEY:-}
  MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER:-platform_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1g } } }

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }

  # One-shot: extensions, roles, schema migrations, functions, grants and RLS (idempotent).
  migrate:
    image: ${WORKER_IMAGE:-platform-worker:latest}
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_OWNER_URL: postgres://${POSTGRES_OWNER:-platform_owner}:${POSTGRES_OWNER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-platform}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-platform-web:latest}
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    expose: ["3000"]
    # Coolify: assign the domain to this service on port 3000 (TLS terminated by the proxy)
    deploy: { resources: { limits: { memory: 1g } } }

  worker:
    image: ${WORKER_IMAGE:-platform-worker:latest}
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    stop_grace_period: 30s
    deploy: { resources: { limits: { memory: 1g } } }

volumes:
  pgdata:
  valkeydata:
