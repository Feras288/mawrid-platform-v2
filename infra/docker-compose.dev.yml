# Local development services. Ports chosen to avoid other projects on this host.
name: platform-dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: platform
    ports: ["5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["6390:6379"]
    volumes: [redisdata:/data]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=50", "-master.volumeSizeLimitMB=64", "-master.volumePreallocate=false"]
    ports: ["9010:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 256m
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1026:1025", "8026:8025"]
    mem_limit: 64m
volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
